name: Release approved v0.9.20
on:
  push:
    paths: ['.github/workflows/release-v0920.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and publish the approved source
        run: |
          curl -fsSL --retry 4 https://maeul-city-classroom.vercel.app/release-v0.9.20.zip -o /tmp/release.zip
          echo 'aa85c24ceb1d70230f32282a006105f41ab58b12f200a20c825bdf933318b05f  /tmp/release.zip' | sha256sum -c
          git fetch origin main
          git switch --detach FETCH_HEAD
          unzip -oq /tmp/release.zip
          npm test
          git config user.name drag2k
          git config user.email '323482467+drag2k@users.noreply.github.com'
          git add .
          git commit -m 'Release v0.9.20: touch maps, inward roads and presentation limits'
          git tag v0.9.20
          git push --atomic origin HEAD:main refs/tags/v0.9.20
