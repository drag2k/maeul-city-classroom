name: Publish verified classroom release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish-version.yml
permissions:
  contents: write
concurrency: publish-classroom-release
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify live teacher and student workflow
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const version=JSON.parse(readFileSync('package.json')).appVersion;
          const origin='https://maeul-city-classroom.vercel.app';
          let ready=false;
          for(let i=0;i<50;i++){
            try{
              const status=await (await fetch(origin+'/api/features')).json();
              if(status.version===version && status.storage==='postgres'){ready=true;break}
            }catch{}
            await new Promise(r=>setTimeout(r,6000));
          }
          assert.ok(ready,'Production version is not ready');
          let code;
          async function api(action,data,token='') {
            const response=await fetch(origin+'/api/'+action,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({code,...data})});
            assert.equal(response.status,200,action);
            return response.json();
          }
          const questions=['어디에서 사람들이 만났나요?','공통점은 무엇인가요?'];
          const teacher=await api('create',{title:'배포 검증 '+version,password:randomUUID(),settings:{vlimit:10,climit:10,assessment:true,questions,groups:[{nums:[1],rep:1}]}});
          code=teacher.code;
          const student=await api('join',{num:1});
          const state=await api('state',{},student.token);
          assert.deepEqual(state.settings.questions,questions);
          const answers=['시장','여러 사람이 모인다'];
          await api('answer',{answers,rev:0,questionVersion:state.settings.questionVersion},student.token);
          await api('review',{num:1,rev:1},teacher.token);
          const reviewed=await api('state',{},teacher.token);
          assert.deepEqual(reviewed.answers[1],answers);
          assert.equal(reviewed.answerMeta[1].reviewed,true);
          console.log('PASS production classroom creation, custom questions, student submission and teacher review');
          JS
      - name: Create GitHub release and version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').appVersion")
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "마을모아 $tag" --notes "정식 수업 주소 https://maeul-city-classroom.vercel.app/"
          fi
