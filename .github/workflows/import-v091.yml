name: Import approved v0.9.1
on:
  push:
    paths:
      - '.github/workflows/import-v091.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'drag2k/maeul-city-classroom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved source
        run: |
          curl --fail --location --retry 3 https://maeul-city-classroom.vercel.app/release-source-v0.9.1.zip -o /tmp/maeul-source.zip
          echo 'a0e9a4f1c6a9f837190c45f376e73ea3b31a6ef47f64c15b96cbe459aa074d4c  /tmp/maeul-source.zip' | sha256sum --check
          unzip -o /tmp/maeul-source.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify classroom workflows
        run: npm test
      - name: Commit approved release and remove importer
        run: |
          rm .github/workflows/import-v091.yml
          git config user.name 'drag2k'
          git config user.email '323482467+drag2k@users.noreply.github.com'
          git add .
          git commit -m 'Release v0.9.1 - verified classroom app and teacher guide'
          git tag v0.9.1
          git push --atomic origin HEAD:main refs/tags/v0.9.1
